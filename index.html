<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STOR Portal</title><style>
body{margin:0;font-family:Arial;background:#eef7ff;color:#152235}.wrap{max-width:720px;margin:auto;padding:15px}.card,.hero{background:#fff;border-radius:20px;padding:20px;margin:14px 0}.hero{background:linear-gradient(135deg,#1255b9,#347ff0);color:#fff}button{padding:11px 15px;border:0;border-radius:12px;font-weight:bold;margin:4px}.blue{background:#2877ea;color:#fff}.green{background:#08b978;color:#fff}.red{background:#e64c5c;color:#fff}input,textarea,select{width:100%;padding:12px;box-sizing:border-box;margin:5px 0 10px;border:1px solid #d5e3ec;border-radius:12px}textarea{min-height:100px}.hidden{display:none}.item{padding:12px 0;border-bottom:1px solid #e5edf2}.tag{float:right;padding:5px 8px;border-radius:15px;font-size:11px}.pending{background:#fff0c8}.accepted,.paid{background:#dcf7e9}.rejected{background:#ffe1e5}.muted{font-size:13px;color:#718092}</style></head><body><div class="wrap"><header>✉️ <b>STOR GMAIL</b><span id="who" style="float:right">Guest</span></header>
<div id="guest"><section class="hero"><h1>STOR Portal</h1><button class="blue" onclick="auth('login')">Login</button><button onclick="auth('register')">Daftar</button></section><section class="card"><h3>Rules</h3><p id="rules">...</p></section></div>
<div id="member" class="hidden"><section class="hero"><h2>Member</h2><p id="me"></p><b id="bal"></b><br><button onclick="logout()">Keluar</button></section><section class="card"><h3>📨 STOR Email</h3><p class="muted">Hanya alamat Gmail. Jangan masukkan password, OTP, recovery code, cookie, atau kredensial login.</p><textarea id="emails" placeholder="nama@gmail.com"></textarea><input id="note" placeholder="Catatan"><button class="blue" onclick="stor()">Kirim STOR</button></section><section class="card"><h3>Riwayat</h3><div id="hist"></div></section><section class="card"><h3>Penarikan</h3><input id="method" placeholder="DANA / Bank / GoPay"><input id="target" placeholder="Nomor tujuan"><input id="amount" type="number" placeholder="Nominal"><button class="blue" onclick="withdraw()">Ajukan</button><div id="wh"></div></section></div>
<div id="admin" class="hidden"><section class="hero"><h2>🛡️ Admin Panel</h2><button onclick="logout()">Keluar</button></section><section class="card"><h3>Pengaturan</h3><input id="price" type="number" placeholder="Harga STOR"><input id="min" type="number" placeholder="Minimal penarikan"><select id="open"><option value="1">STOR Dibuka</option><option value="0">STOR Ditutup</option></select><textarea id="arules"></textarea><button class="blue" onclick="settings()">Simpan</button><input id="np" type="password" placeholder="Password admin baru"><button onclick="pass()">Ganti Password</button></section><section class="card"><h3>STOR Masuk</h3><div id="incoming"></div></section><section class="card"><h3>Penarikan</h3><div id="aw"></div></section></div>
<div id="modal" class="card hidden" style="position:fixed;left:10%;right:10%;top:20%;z-index:5;box-shadow:0 10px 40px #0005"><h3 id="mt"></h3><input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Password"><p id="err"></p><button class="blue" onclick="goAuth()">Lanjut</button><button onclick="closeM()">Batal</button></div></div>
<script>
let mode="login";const $=x=>document.getElementById(x);async function api(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o}),j=await r.json();if(!r.ok)throw Error(j.error||"Gagal");return j}
function auth(x){mode=x;$("mt").textContent=x==="login"?"Login":"Daftar";$("modal").classList.remove("hidden")}function closeM(){$("modal").classList.add("hidden")}
async function goAuth(){try{await api("/api/"+mode,{method:"POST",body:JSON.stringify({email:$("em").value,password:$("pw").value})});closeM();boot()}catch(e){$("err").textContent=e.message}}
async function boot(){let r=await fetch("/api/me");if(!r.ok){$("guest").classList.remove("hidden");$("member").classList.add("hidden");$("admin").classList.add("hidden");return}let u=await r.json();$("guest").classList.add("hidden");$("who").textContent=u.role==="admin"?"Admin":"Member";if(u.role==="admin"){ $("admin").classList.remove("hidden");loadAdmin()}else{$("member").classList.remove("hidden");$("me").textContent=u.email;$("bal").textContent="Saldo Rp"+u.balance.toLocaleString("id-ID");$("method").value=u.payout_method||"";$("target").value=u.payout_target||"";loadMember()}}
async function loadMember(){let a=await api("/api/submissions"),w=await api("/api/withdrawals");$("hist").innerHTML=a.map(x=>`<div class=item><b>${x.email}</b><span class="tag ${x.status}">${x.status}</span><div class=muted>${x.created_at}</div></div>`).join("")||"Kosong";$("wh").innerHTML=w.map(x=>`<div class=item>Rp${x.amount.toLocaleString("id-ID")} • ${x.status}</div>`).join("")}
async function stor(){try{let x=await api("/api/submissions",{method:"POST",body:JSON.stringify({emails:$("emails").value,note:$("note").value})});alert(x.count+" email dikirim");loadMember()}catch(e){alert(e.message)}}
async function withdraw(){try{await api("/api/profile",{method:"POST",body:JSON.stringify({method:$("method").value,target:$("target").value})});await api("/api/withdrawals",{method:"POST",body:JSON.stringify({amount:+$("amount").value,method:$("method").value,target:$("target").value})});alert("Diajukan");boot()}catch(e){alert(e.message)}}
async function loadAdmin(){let s=await api("/api/settings"),a=await api("/api/submissions"),w=await api("/api/withdrawals");$("price").value=s.price;$("min").value=s.min;$("open").value=s.open?"1":"0";$("arules").value=s.rules;$("incoming").innerHTML=a.filter(x=>x.status==="pending").map(x=>`<div class=item><b>${x.email}</b><div>${x.member}</div><button class=green onclick="act(${x.id},'accept')">Terima</button><button class=red onclick="act(${x.id},'reject')">Tolak</button></div>`).join("")||"Tidak ada";$("aw").innerHTML=w.map(x=>`<div class=item>${x.member} • Rp${x.amount.toLocaleString("id-ID")} • ${x.status} ${x.status==="pending"?`<button class=green onclick="pay(${x.id})">Bayar</button>`:""}</div>`).join("")}
async function act(id,a){await api("/api/submissions/"+id+"/"+a,{method:"POST"});loadAdmin()}async function pay(id){await api("/api/withdrawals/"+id+"/pay",{method:"POST"});loadAdmin()}async function settings(){await api("/api/settings",{method:"POST",body:JSON.stringify({price:+$("price").value,min:+$("min").value,open:$("open").value==="1",rules:$("arules").value})});alert("Disimpan")}async function pass(){await api("/api/admin/password",{method:"POST",body:JSON.stringify({password:$("np").value})});alert("Password diganti")}
async function logout(){await api("/api/logout",{method:"POST"});boot()}api("/api/rules").then(x=>$("rules").textContent=x.rules);boot();
</script></body></html>
